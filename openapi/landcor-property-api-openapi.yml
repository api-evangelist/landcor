        exterior_type_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exterior Type Code
        exterior_type_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Exterior Type Description
        corner_lot:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Corner Lot
        waterfront_lot:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Waterfront Lot
        water_lot:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Water Lot
        prime_view_lot:
          anyOf:
          - type: boolean
