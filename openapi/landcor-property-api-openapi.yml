          description: Comma separated list of additional parcel identifiers.
        legal_lot:
          anyOf:
          - type: string
          - type: 'null'
          title: Legal Lot
          description: Lot identifier parsed from the legal description.
        legal_block:
          anyOf:
          - type: string
          - type: 'null'
          title: Legal Block
          description: Block identifier parsed from the legal description.
        legal_section:
          anyOf:
          - type: string
          - type: 'null'
