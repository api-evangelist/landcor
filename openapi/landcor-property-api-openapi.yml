          description: Section identifier parsed from the legal description.
        legal_township:
          anyOf:
          - type: string
          - type: 'null'
          title: Legal Township
          description: Township identifier parsed from the legal description.
        legal_range:
          anyOf:
          - type: string
          - type: 'null'
