aid: landcor
url: https://raw.githubusercontent.com/api-evangelist/landcor/refs/heads/main/apis.yml
name: Landcor Data
kind: company
description: >-
  Landcor Data Corporation is a New Westminster, British Columbia property data and
  automated valuation company, founded in 2000, that sells residential valuations,
  assessment detail and land title documents across the roughly 1.9 million residential
  properties in BC. It sits in the valuation and public-record layer of the Canadian
  value chain rather than the listings layer: its inputs are BC Assessment detail, Land
  Title and Survey Authority (LTSA) title and document search, BC Registry Services,
  municipal tax certificates and materials licensed from the Integrated Cadastral
  Information Society (ICIS), and its outputs are the Valuator AVM report, the Adjusted
  Value Profiler, the Property Profiler, Title Search Plus and historic valuation
  reports sold to lenders, appraisers, notaries, insurers and brokerages. Its API
  posture is the unusual case in this study: a real, live, anonymously readable
  machine-readable contract exists with no developer programme around it. The host
  api.landcor.com runs a FastAPI service on Azure App Service in Canada Central that
  serves a valid OpenAPI 3.1.0 document titled "Landcor Property API" version 0.1.0 at
  /openapi.json, with Swagger UI at /docs and ReDoc at /redoc, all returning HTTP 200
  without credentials. Twelve operations cover property search, property detail, PDF
  report retrieval, valuation range, valuation history, loan-to-value checks,
  neighbourhood sales series, comparables, address autocomplete and an AVM narrative
  summary. Every operation except /health requires an HTTP Bearer token and returns
  401 "Missing token" without one, and no route to obtain that token is published
  anywhere: landcor.com carries no developer, API, partner or data-licensing page, does
  not link api.landcor.com at all, and the store.landcor.com self-serve account is for
  buying individual reports through the web store, not for API credentials. RESO is
  absent, which is the expected Canadian answer. Landcor is not among the nineteen
  Canadian organizations RESO lists as members, holds no Web API or Data Dictionary
  certification, exposes no OData $metadata document, and uses its own PID identifier
  rather than the RESO Universal Property Identifier. No open, unlicensed dataset is
  published: the underlying assessment, title and cadastral data is licensed to Landcor
  from provincial bodies and resold, so the public record itself is a commercial
  product here.
