aid: landcor
name: Landcor Data
review:
  question: Does Landcor Data publish a public, documented API, and what is its RESO posture?
  answer: true
  answerQualifier: >-
    A public machine-readable contract exists and is anonymously readable, but no public
    route to credentials exists. The contract is open and the access is closed.
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: valuation-avm

sectorPosture:
  homeMarket: Canada
  resoPosture: >-
    No RESO reference found. Landcor Data is not RESO-certified and is not a RESO member.
    RESO's own Canadian Membership page (https://www.reso.org/canadian-membership/, HTTP
    200, fetched 2026-07-26) enumerates nineteen Canadian member organizations, namely
    The Canadian Real Estate Association, Centris, Clientime, Falcon Technologies
    Corporation, Listed, Local Logic, Multi List Platform Limited Partnership, Municipal
    Property Assessment Corporation (MPAC), Origin Confirmed Ltd, Phoenix Software,
    Planitar, PropTexx, Prospects Software, REALTORS Association of Edmonton, Real Estate
    Board of Greater Vancouver, Saskatchewan REALTORS Association, Templates 4 Business,
    Victoria Real Estate Board and Winnipeg Regional Real Estate Board, and Landcor is not
    among them. No RESO Web API certification, no Data Dictionary certification and no
    version, no RESO certification directory entry, no Reso or OData endpoint, and no
    $metadata document were found. https://api.landcor.com/$metadata and
    https://api.landcor.com/odata/$metadata both returned HTTP 404 with
    {"detail":"Not Found"}, and https://www.landcor.com/$metadata returned HTTP 404. The
    Universal Property Identifier (UPI) is not used. Landcor keys everything on its own
    PID in xxx-xxx-xxx format, documented in the OpenAPI as "Property identifier in format
    xxx-xxx-xxx". This absence is structurally expected twice over. First, RESO
    certification is a US industry mandate driven by NAR Policy Statement 7.90 and applies
    to MLSs, and Canadian residential listings instead flow through CREA's national Data
    Distribution Facility. Second, Landcor is not a listings company at all. It is a
    valuation and public-record reseller whose inputs are BC Assessment, the Land Title
    and Survey Authority and BC Registry Services, none of which RESO governs.
  resoCertified: false
  resoCertificationType: none
  resoDataDictionaryVersion: null
  resoDirectoryEvidence: >-
    Negative evidence rests on RESO's published Canadian membership roster at
    https://www.reso.org/canadian-membership/ (HTTP 200, fetched 2026-07-26), which does
    not list Landcor. Direct probes of api.landcor.com and www.landcor.com for OData
    service documents returned HTTP 404 in every case. No RESO, OData, Data Dictionary or
    UPI string appears anywhere in the harvested OpenAPI document or on the marketing
    site.
  accessGate: none-published
  accessGateDetail: >-
    Nothing is published about how a developer obtains API credentials, and this is the
    central finding for Landcor. The Landcor Property API plainly issues tokens to
    someone: every operation except /health declares an HTTPBearer security scheme and
    returns HTTP 401 with {"detail":"Missing token"} when called anonymously, verified on
    2026-07-26 against /property/search?q=test, /address/autocomplete?q=main and
    /valuationRange/123456789. But there is no developer portal, no API programme page, no
    key request form, no partner page, no data-licensing page, no API pricing and no API
    terms of use anywhere on landcor.com, and the marketing site never references the host
    api.landcor.com. The subdomains developer.landcor.com, developers.landcor.com,
    docs.landcor.com, valuator.landcor.com, portal.landcor.com, ws.landcor.com and
    data.landcor.com do not resolve in DNS, and /developers, /docs, /api, /api-docs,
    /openapi.json and /swagger.json on landcor.com all return genuine HTTP 404 WordPress
    error pages. What Landcor does publish is a self-serve retail signup at
    https://store.landcor.com/user/user_add.aspx (HTTP 200), an open form asking for
    contact details, job title and a market segment drawn from Accounting, Appraising,
    Banking and Finance, Consumer, Developers/Investment, Government, Insurance, Legal and
    Notary, Marketing and Retail, Mortgage, Other and Real Estate Brokerage, with no
    professional-licence verification and no visible agreement gate. That account buys
    individual reports through the web store; it is not an API credential. A developer
    wanting the API must therefore contact Landcor commercially (1-866-LANDCOR, or the
    contact form at https://www.landcor.com/contact/); no published path exists. The
    binding legal document a customer accepts is the Acceptable Use policy at
    https://www.landcor.com/acceptable-use/ (HTTP 200), which obliges users "not to
    stockpile data pulls" and "to not share licenses among offices or to share data pulls
    among various users", and which discloses that "Landcor.com services include materials
    licensed by Landcor from the Integrated Cadastral Information Society, or ICIS". Those
    per-seat, no-stockpiling terms are the plainest statement of why bulk API access is
    not offered self-serve.
  openData: false
  openDataDetail: >-
    No open, unlicensed, publicly callable Landcor dataset exists. Every data product is
    resold from licensed provincial sources: BC Assessment property detail, LTSA title
    documents and plans, BC Registry Services, municipal tax certificates and ICIS
    cadastral materials. The Acceptable Use policy does reference content available under
    the Open Government Licence - British Columbia, but that is Landcor consuming
    provincial open data as an input, not Landcor publishing an open output. Canada has no
    national counterpart to HM Land Registry Price Paid or Ordnance Survey open products,
    and land registration is provincial and largely privatised, so the public record
    reaches the market as a priced commercial product. The only anonymously readable
    artifacts Landcor serves are the API's own contract documents, which are metadata
    about the service rather than data.
  authModel: >-
    HTTP Bearer token. The harvested OpenAPI declares exactly one security scheme,
    components.securitySchemes.HTTPBearer with type "http" and scheme "bearer", and every
    operation except GET /health carries security [{"HTTPBearer": []}]. There is no OAuth
    2.0 authorization or token endpoint in the contract, no client-credentials flow, no
    scopes, no API-key header and no refresh mechanism, so the token is an opaque bearer
    credential issued out of band. No OpenID Connect discovery document is served:
    https://api.landcor.com/.well-known/openid-configuration returned HTTP 404,
    https://www.landcor.com/.well-known/openid-configuration returned HTTP 404 (WordPress
    error page), and https://store.landcor.com/.well-known/openid-configuration returned
    HTTP 404. No SAML member portal was found. The retail web store at store.landcor.com
    uses ordinary ASP.NET forms sign-in with a password policy of at least eight
    characters including uppercase, lowercase and a special character, plus a secret
    question, which is a customer login rather than a developer identity system. No
    security.txt is served (https://www.landcor.com/.well-known/security.txt returned HTTP
    404), though a human-readable security policy page exists at
    https://www.landcor.com/security-policy/.
  webhooksEventsSdksPostman: >-
    None found, and the absence is the finding. The OpenAPI contains no webhooks object,
    no callbacks, no AsyncAPI counterpart and no event or subscription operations; all
    twelve operations are synchronous request/response. No SDK, client library or CLI is
    published. The GitHub organization https://github.com/Landcor (HTTP 200, id
    291165771, type Organization, name "Landcor Data Corporation", blog
    https://www.landcor.com, location Canada, created 2026-06-05) holds exactly one public
    repository, ".github", with no description and no API artifacts. No Postman workspace
    or collection was found. No changelog, status page or versioning policy is published;
    the contract self-reports version 0.1.0.
  productApiFamily: >-
    The website segments the commercial product line as valuation, property records and
    land title. Valuation and AVM: The Valuator (the flagship residential AVM report), the
    Adjusted Value Profiler (monthly adjusted values with market insight), and the
    Historic Property Valuator (past AVM values for legal and estate matters). Property
    records: The Property Profiler (BC Assessment values and property detail), PID Lookup,
    and Economic Rent. Land title and registry, sourced from LTSA and BC Registry
    Services: Title Search Plus, Name Search, Documents and Plans, Current Title with
    Cancelled Charges, Historic Title and Title Number Search, Manufactured Home Title,
    State of Title Certificate, and BC Registry Services Search. Municipal: Property Tax
    Certificate. The API surface covers only part of that catalogue and maps to it
    cleanly: Property (search, detail, PDF report, address autocomplete), Valuation (range,
    updates, history, LTV check, neighbourhood sales series), Comparables, AVM Summary and
    Health. Nothing in the API covers title search, registry search or tax certificates,
    which remain web-store products. Stated audiences are mortgage professionals,
    appraisal professionals, real estate professionals, legal and notary professionals,
    banks and insurers.
  coverage: >-
    British Columbia only. The company states coverage of more than 1.9 million
    residential properties across BC, built on an exclusive relationship with the BC
    Assessment Authority. This is a single-province footprint, narrower than the national
    CREA/DDF listings seam and narrower than the pan-Canadian challenger portals.

findings:
  summary: |
    Landcor Data is the inverse of the usual real-estate finding. Most organizations in
    this sector publish developer marketing and hide the contract; Landcor publishes the
    contract and no marketing at all. The host api.landcor.com resolves via CNAME to
    landcor-api-feergpd0fhbqegck.canadacentral-01.azurewebsites.net, an Azure App Service
    in Canada Central fronting a uvicorn/FastAPI application, and serves a valid OpenAPI
    3.1.0 document at /openapi.json (HTTP 200, 47,840 bytes, Server: uvicorn) titled
    "Landcor Property API" version 0.1.0, with Swagger UI at /docs and ReDoc at /redoc,
    all anonymous and all HTTP 200. The document parses cleanly, declares twelve
    operations across the tags Health, Property, Valuation, Comparables and AVM Summary,
    and defines 38 component schemas including PropertyResponse, BCAssessmentSection,
    ValuationRangeResponse, ValuationHistoryResponse, ComparablesResponse,
    NeighbourhoodSalesSeriesResponse, LTVCheckRequest, ClimateEvents, PermitHistory and
    NeighbourhoodScores. This is a genuine, harvestable machine-readable contract and it
    has been saved verbatim.
    What does not exist is any way in. Only GET /health is unauthenticated. Every other
    operation declares HTTPBearer and returns 401 {"detail":"Missing token"}. Landcor
    publishes no developer portal, no key issuance route, no API pricing and no API terms,
    and never links api.landcor.com from landcor.com, whose only other machine surface is
    the stock WordPress REST API at /wp-json/ (HTTP 200, namespaces oembed/1.0,
    contact-form-7/v1, bsf-custom-fonts/v1, custom-fonts/v1) - a CMS artifact of the
    marketing site, not a Landcor product, and deliberately not listed in apis.yml.
    Two secondary observations are worth recording. The API is early-stage and internal in
    tone: version 0.1.0, no servers block, no info.description, no contact or licence,
    empty top-level tags array, and operation descriptions that are raw Python docstrings
    leaking implementation detail, naming the stored procedure
    USP_SEARCH_SERVICE_PROPERTY behind /property/search and "the legacy Landcor SOAP
    webservice" that produces the base64-encoded, password-protected PDF behind
    /property/{pid}/report/pdf. That SOAP reference independently corroborates Landcor's
    own Full Stack .NET Developer job posting at
    https://www.landcor.com/full-stack-net-developer/, which asks the hire to "Build and
    enhance APIs (REST and SOAP) that integrate with internal systems" and requires
    "Strong experience building RESTful APIs and familiarity with SOAP-based services."
    The public REST contract is a modern facade over an older SOAP estate.
    RESO is absent and that is the honest and expected answer. Landcor is not a listings
    company, is not a RESO member, holds no certification, serves no $metadata, and uses
    its own PID rather than the UPI. The Canadian counterweight to US private control does
    not appear here either: there is no open data. The provincial record that feeds
    Landcor is licensed to it, and the Acceptable Use policy forbids stockpiling data
    pulls and sharing licences between offices, which is precisely the commercial logic
    that keeps the API behind an unpublished bearer token.
  developerPortal: https://api.landcor.com/docs
  developerPortalConfirmed: true
  developerPortalNote: >-
    Confirmed live HTTP 200 anonymously: FastAPI-generated Swagger UI at
    https://api.landcor.com/docs and ReDoc at https://api.landcor.com/redoc, both titled
    "Landcor Property API". This is a real, anonymously reachable interactive API
    documentation surface and not a member login. It is not, however, a self-serve
    onboarding portal: it offers no registration, no key issuance and no plans, so a
    developer can read the whole contract and still cannot call a single authenticated
    operation.
  openapiHarvested: true
  specsCount: 1
  gated: true
  gateType: none-published
  gateNote: >-
    Gated at the credential, not at the contract. The specification and both rendered
    documentation surfaces are fully open; every functional operation is closed behind an
    out-of-band bearer token with no published issuance path.

