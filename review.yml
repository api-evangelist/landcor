actions:
  apisYmlCreated: true
  apisListed: 1
  openapiDirectoryCreated: true
  specsHarvested: 1
  reason: >-
    One API is listed because one real, live, anonymously readable machine-readable contract
    exists and was harvested verbatim, and because Landcor serves rendered documentation for it
    at /docs and /redoc. The stock WordPress REST API at www.landcor.com/wp-json/ is reachable
