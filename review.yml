specs:
  - path: openapi/landcor-property-api-openapi.json
    type: OpenAPI
    version: 3.1.0
    title: Landcor Property API
    apiVersion: 0.1.0
    sourceURL: https://api.landcor.com/openapi.json
    httpStatus: 200
    bytes: 47840
    contentType: application/json
    server: uvicorn
    fetchedDate: '2026-07-26'
    parsed: true
    parseNote: Parses cleanly under both json.load and yaml.safe_load. Saved verbatim, unmodified.
    operationCount: 12
    pathCount: 12
    schemaCount: 38
    securitySchemes:
      - name: HTTPBearer
        type: http
        scheme: bearer
    unauthenticatedOperations:
      - GET /health
    operations:
      - GET /health (Health) - service liveness, returns {"status":"ok"}
      - GET /property/search (Property) - address filters unit_number, street_direction, street_number, street_name, postal_code
      - GET /property/{pid} (Property) - full property detail, PID in xxx-xxx-xxx format
      - GET /property/{pid}/report/pdf (Property) - base64-encoded, password-protected PDF via the legacy SOAP webservice
      - GET /address/autocomplete (Property) - partial address suggestions, minimum 3 characters
      - GET /valuationRange/{pid} (Valuation) - low and high AVM valuation range
      - GET /valuationRange/{pid}/updates (Valuation) - compatibility alias mirroring the valuation range
      - GET /valuationRange/{pid}/history (Valuation) - chronological valuation history
      - POST /valuation/ltv-check (Valuation) - compares AVM value against a supplied loan-to-value amount
      - GET /valuation/neighbourhood/{neighbourhood_code}/{unit_type_code}/sales (Valuation) - monthly or rolling3m sales series
      - GET /comparables/{pid} (Comparables) - comparable properties for a PID
      - POST /generate-avm-summary (AVM Summary) - narrative summary generated from Landcor AVM data
    qualityNotes: >-
      No servers block, so the base URL https://api.landcor.com is inferred from the host that
      served the document. No info.description, no info.contact, no info.license, no
      externalDocs, empty top-level tags array, no examples, no webhooks, no callbacks. Version
      is 0.1.0. Several operation descriptions are unprocessed Python docstrings that disclose
      internals, including the stored procedure USP_SEARCH_SERVICE_PROPERTY and "the legacy
      Landcor SOAP webservice". Saved verbatim as harvested; nothing was edited or removed.

