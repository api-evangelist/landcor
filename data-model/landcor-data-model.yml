note: >-
  Entity graph derived mechanically from the OpenAPI $ref links and the identifier fields that
  cross operations. Landcor has no published object reference to search, so id semantics below
  are read off the spec's own field names, patterns and descriptions. The model is unusual for
  a REST API: there are no server-side resources with lifecycles — every schema is a
  projection of the BC public record keyed on one identifier, the Landcor PID.
identifiers:
- name: pid
  entity: Property
  format: ^\d{3}-\d{3}-\d{3}$
  description: Landcor property identifier, the primary key of the whole API. Not the RESO UPI.
- name: neighbourhood_code
  entity: Neighbourhood
  source_field: BCAssessmentSection.neighbourhood_code
  description: BC Assessment neighbourhood identifier; required as a path parameter by the neighbourhood sales series.
- name: unit_type_code
  entity: UnitType
  source_field: PropertyUsageSection.unit_type_code
  description: Unit-type grouping used to bucket comparable properties; path parameter on the sales series.
- name: aa_code
  entity: AssessmentArea
  source_field: PropertyReportPdfResponse.aa_code / BCAssessmentSection.assessment_area_code
  description: BC Assessment area code, resolved from the PID to drive the legacy SOAP report service.
- name: j_code
  entity: Jurisdiction
  source_field: PropertyReportPdfResponse.j_code / BCAssessmentSection.jurisdiction_code
  description: Municipal jurisdiction code.
- name: roll_number
  entity: AssessmentRoll
  source_field: PropertyReportPdfResponse.roll_number / BCAssessmentSection.roll_number
  description: Assessment roll number within a jurisdiction; with aa_code and j_code it is the BC Assessment composite key.
entities:
- name: Property
  root_schema: PropertyResponse
  operations: [read_property_property__pid__get, search_property_property_search_get, autocomplete_address_address_autocomplete_get]
  description: >-
    The subject property. Returned as a fixed envelope of seven named sections rather than a
    flat record; there is no field expansion, you always receive the whole composition.
  sections: [address, assessment, usage, exterior, interior, other, sale]
- name: PropertySearchResult
  root_schema: PropertySearchResult
  operations: [search_property_property_search_get]
  description: Thin search projection — pid, jurisdiction, address, actual_use_type — backed by the stored procedure USP_SEARCH_SERVICE_PROPERTY.
- name: AddressSuggestion
  root_schema: AutocompleteResponse
  operations: [autocomplete_address_address_autocomplete_get]
  description: Address typeahead; suggestions[] plus count.
- name: ValuationRange
  root_schema: ValuationRangeResponse
  operations: [read_valuation_range_valuationRange__pid__get, read_property_monthly_update_valuationRange__pid__updates_get]
  description: Current AVM low/high band for a PID.
- name: ValuationHistory
  root_schema: ValuationHistoryResponse
  operations: [read_valuation_history_valuationRange__pid__history_get]
  description: Time series of ValuationHistoryPoint (snapshot_date, low_range_value, high_range_value).
- name: LTVCheck
  root_schema: LTVCheckResponse
  operations: [run_ltv_check_valuation_ltv_check_post]
  description: Stateless comparison of a proposed loan amount against the stored AVM value; has_avm plus avm_exceeds_ltv. Creates nothing.
- name: NeighbourhoodSalesSeries
  root_schema: NeighbourhoodSalesSeriesResponse
  operations: [read_neighbourhood_sales_series_valuation_neighbourhood__neighbourhood_code___unit_type_code__sales_get]
  description: Aggregated sales series for a neighbourhood + unit type, monthly or rolling three-month.
- name: Comparables
  root_schema: ComparablesResponse
  operations: [read_comparables_comparables__pid__get]
  description: Comparable properties for a PID; each ComparableProperty repeats the full Property section composition plus distance to the subject.
- name: PropertyReportPdf
  root_schema: PropertyReportPdfResponse
  operations: [read_property_pdf_property__pid__report_pdf_get]
  description: >-
    Base64-encoded, password-protected PDF returned inside a JSON envelope, produced by the
    legacy Landcor SOAP webservice after the PID is resolved to aa_code, j_code and roll_number.
- name: AVMSummary
  root_schema: LandcorAVMSummaryResponse
  operations: [generate_avm_summary_generate_avm_summary_post]
  description: >-
    Narrative summary plus a ValidationResult. Inverted flow — the CALLER supplies the AVM data
    as LandcorAVMSummaryRequest and the service only narrates it, so this is the one operation
    whose input is the data model rather than an identifier.
