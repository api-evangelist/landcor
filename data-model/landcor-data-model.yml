implicit_joins:
- description: >-
    Undeclared cross-operation dependency. The neighbourhood sales series requires
    neighbourhood_code and unit_type_code as PATH parameters, but neither is obtainable from
    that operation — they come from a prior read_property call
    (BCAssessmentSection.neighbourhood_code and PropertyUsageSection.unit_type_code). Nothing in
    the contract links them.
  from: read_property_property__pid__get
  to: read_neighbourhood_sales_series_valuation_neighbourhood__neighbourhood_code___unit_type_code__sales_get
- description: >-
    generate_avm_summary consumes shapes (SubjectProperty, ValuationMeta, ComparableSale) that
    parallel but do NOT reuse the response schemas of read_property, read_valuation_range and
    read_comparables. Field names differ (SubjectProperty.floor_area_sqft vs
    InteriorDataSection.total_finished_area), so a caller must map between them by hand. This is
    the single largest modelling gap in the API.
  from: [read_property_property__pid__get, read_valuation_range_valuationRange__pid__get, read_comparables_comparables__pid__get]
  to: generate_avm_summary_generate_avm_summary_post
