  binding: rest
  confidence: high
- tool: generate_avm_summary
  category: avm-summary
  rest: [generate_avm_summary_generate_avm_summary_post]
  binding: rest
  confidence: high
  note: >-
    The heaviest input in the API: LandcorAVMSummaryRequest composes ten sub-schemas
    (SubjectProperty, ValuationMeta, AssessmentYear[], ComparableSale[], NeighbourhoodInsights,
    HistoricalSale[], ValuationChange, ClimateEvents, PermitHistory, NeighbourhoodScores). The
